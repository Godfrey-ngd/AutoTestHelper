# Conda environment for AutoTestDesign (Assignment 2)
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune

name: autotestdesign
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - flask>=3.0
  - pandas>=2.1
  - pytest>=8.0
  - httpx>=0.26
  - pip:
      - -r requirements.txt
